<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>example.app · API Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    :root {
      --bg: #07090e;
      --s1: #0d1321;
      --s2: #111827;
      --s3: #1a2540;
      --b1: #1e2d48;
      --b2: #2d4165;
      --t1: #e2e8f3;
      --t2: #94a3b8;
      --t3: #475569;
      --cyan: #06d6c0;
      --cyan-d: #059e8f;
      --amber: #fbbf24;
      --amber-d: #d97706;
      --green: #10b981;
      --red: #f43f5e;
      --purple: #a78bfa;
      --mono: 'JetBrains Mono', monospace;
      --ui: 'Outfit', system-ui, sans-serif;
    }
    body { font-family: var(--ui); background: var(--bg); color: var(--t1); overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 10px; }
    /* ── Header ── */
    .header { height: 50px; display: flex; align-items: center; padding: 0 20px; gap: 14px; background: var(--s1); border-bottom: 1px solid var(--b1); flex-shrink: 0; z-index: 10; }
    .logo-mark { display: flex; align-items: center; gap: 8px; }
    .logo-name { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--cyan); letter-spacing: 0.02em; }
    .header-sep { width: 1px; height: 18px; background: var(--b2); }
    .header-subtitle { font-size: 12px; color: var(--t3); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
    .header-gap { flex: 1; }
    .header-badge { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--b2); font-family: var(--mono); font-size: 11px; color: var(--t3); cursor: pointer; transition: border-color 0.15s; }
    .header-badge:hover { border-color: var(--cyan); color: var(--t2); }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 2.5s ease-in-out infinite; }
    .demo-dot { background: var(--amber); animation: none; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .icon-btn { background: none; border: 1px solid var(--b1); border-radius: 6px; padding: 6px 8px; color: var(--t3); cursor: pointer; font-size: 15px; line-height: 1; transition: all 0.15s; }
    .icon-btn:hover { border-color: var(--b2); color: var(--t2); }
    /* ── Loading bar ── */
    .loading-bar { height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), var(--cyan-d), var(--cyan), transparent); background-size: 300% 100%; animation: loadingMove 1s linear infinite; flex-shrink: 0; }
    @keyframes loadingMove { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    /* ── Request panels ── */
    .request-row { display: grid; grid-template-columns: 1fr 1fr; flex-shrink: 0; border-bottom: 1px solid var(--b1); }
    .req-panel { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
    .req-panel:first-child { border-right: 1px solid var(--b1); }
    .req-header { display: flex; align-items: center; gap: 8px; }
    .method-tag { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.1em; }
    .tag-get { background: #06d6c018; color: var(--cyan); border: 1px solid #06d6c030; }
    .tag-post { background: #fbbf2418; color: var(--amber); border: 1px solid #fbbf2430; }
    .req-title { font-size: 11px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 0.08em; }
    .req-actions { margin-left: auto; }
    .ghost-btn { background: none; border: none; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--t3); cursor: pointer; font-family: var(--ui); transition: color 0.1s; }
    .ghost-btn:hover { color: var(--t2); }
    .url-row { display: flex; gap: 8px; align-items: center; }
    .url-input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--b1); border-radius: 6px; padding: 7px 12px; color: var(--t1); font-family: var(--mono); font-size: 12px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .url-input:focus { border-color: var(--cyan-d); box-shadow: 0 0 0 2px #06d6c015; }
    .url-input.post-focus:focus { border-color: var(--amber-d); box-shadow: 0 0 0 2px #fbbf2415; }
    .url-input::placeholder { color: var(--t3); }
    .send-btn { flex-shrink: 0; padding: 7px 16px; border: none; border-radius: 6px; font-family: var(--ui); font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s; letter-spacing: 0.03em; white-space: nowrap; }
    .btn-get { background: var(--cyan); color: #07090e; }
    .btn-get:hover:not(:disabled) { background: #09f0d8; }
    .btn-post { background: var(--amber); color: #07090e; }
    .btn-post:hover:not(:disabled) { background: #fcd34d; }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .body-area { background: var(--bg); border: 1px solid var(--b1); border-radius: 6px; padding: 8px 12px; color: var(--t1); font-family: var(--mono); font-size: 12px; line-height: 1.7; outline: none; resize: vertical; min-height: 72px; max-height: 120px; transition: border-color 0.2s; width: 100%; }
    .body-area:focus { border-color: var(--amber-d); }
    .body-area::placeholder { color: var(--t3); }
    .headers-toggle { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--t3); cursor: pointer; user-select: none; padding: 2px 0; }
    .headers-toggle:hover { color: var(--t2); }
    .h-arrow { display: inline-block; transition: transform 0.15s; font-style: normal; font-size: 9px; }
    .h-arrow.open { transform: rotate(90deg); }
    .headers-grid { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; animation: fadeIn 0.1s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .header-row { display: flex; gap: 6px; align-items: center; }
    .header-input { flex: 1; background: var(--bg); border: 1px solid var(--b1); border-radius: 4px; padding: 5px 8px; color: var(--t1); font-family: var(--mono); font-size: 11px; outline: none; }
    .header-input:focus { border-color: var(--b2); }
    .header-input::placeholder { color: var(--t3); }
    .rm-btn { background: none; border: none; color: var(--t3); cursor: pointer; font-size: 15px; padding: 2px 4px; line-height: 1; }
    .rm-btn:hover { color: var(--red); }
    .add-header-btn { font-size: 11px; color: var(--t3); background: none; border: none; cursor: pointer; padding: 2px 0; font-family: var(--ui); text-align: left; }
    .add-header-btn:hover { color: var(--t2); }
    /* ── Results area ── */
    .results-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .results-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 18px; background: var(--s1); border-bottom: 1px solid var(--b1); flex-shrink: 0; flex-wrap: wrap; }
    .tab-group { display: flex; gap: 2px; padding: 2px; background: var(--bg); border: 1px solid var(--b1); border-radius: 8px; }
    .tab { padding: 4px 12px; border-radius: 5px; border: none; font-family: var(--ui); font-size: 12px; font-weight: 600; cursor: pointer; background: transparent; color: var(--t3); transition: all 0.15s; white-space: nowrap; }
    .tab:hover { color: var(--t2); }
    .tab.active-get { background: #06d6c018; color: var(--cyan); }
    .tab.active-post { background: #fbbf2418; color: var(--amber); }
    .resp-meta { display: flex; align-items: center; gap: 8px; }
    .status-chip { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
    .s-2xx { background: #10b98118; color: var(--green); border: 1px solid #10b98130; }
    .s-err { background: #f43f5e18; color: var(--red); border: 1px solid #f43f5e30; }
    .meta-chip { font-family: var(--mono); font-size: 11px; color: var(--t3); }
    .tb-spacer { flex: 1; }
    .search-wrap { position: relative; }
    .search-box { background: var(--bg); border: 1px solid var(--b1); border-radius: 6px; padding: 5px 10px 5px 28px; color: var(--t1); font-family: var(--mono); font-size: 12px; outline: none; width: 180px; transition: border-color 0.2s; }
    .search-box:focus { border-color: var(--b2); }
    .search-box::placeholder { color: var(--t3); }
    .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--t3); font-size: 13px; pointer-events: none; }
    .view-toggle { display: flex; gap: 2px; }
    .vt-btn { background: none; border: 1px solid var(--b1); border-radius: 4px; padding: 4px 8px; color: var(--t3); cursor: pointer; font-size: 11px; font-family: var(--mono); transition: all 0.15s; }
    .vt-btn.active { background: var(--s3); color: var(--t2); border-color: var(--b2); }
    .vt-btn:hover { color: var(--t2); }
    .copy-btn { background: none; border: 1px solid var(--b1); border-radius: 4px; padding: 4px 9px; color: var(--t3); cursor: pointer; font-size: 11px; font-family: var(--mono); transition: all 0.15s; }
    .copy-btn:hover { border-color: var(--b2); color: var(--t2); }
    /* ── Filter bar ── */
    .filter-bar { display: flex; align-items: center; gap: 8px; padding: 7px 18px; background: var(--s2); border-bottom: 1px solid var(--b1); flex-shrink: 0; flex-wrap: wrap; }
    .filter-label { font-size: 11px; color: var(--t3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
    .fc-wrap { position: relative; }
    .filter-chip { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--b1); background: var(--bg); font-size: 11px; font-weight: 600; color: var(--t2); cursor: pointer; transition: all 0.15s; user-select: none; white-space: nowrap; font-family: var(--ui); }
    .filter-chip:hover { border-color: var(--b2); color: var(--t1); }
    .filter-chip.active { background: #06d6c010; border-color: #06d6c040; color: var(--cyan); }
    .fc-count { background: var(--cyan); color: var(--bg); border-radius: 10px; padding: 0px 5px; font-size: 9px; font-weight: 700; line-height: 14px; }
    .fc-arrow { font-size: 8px; opacity: 0.6; }
    .fc-dropdown { position: absolute; top: calc(100% + 4px); left: 0; z-index: 100; background: var(--s1); border: 1px solid var(--b2); border-radius: 8px; min-width: 170px; max-height: 200px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); animation: dropIn 0.12s ease; }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: none; } }
    .fc-option { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12px; color: var(--t2); cursor: pointer; border-bottom: 1px solid var(--b1); font-family: var(--ui); }
    .fc-option:last-child { border-bottom: none; }
    .fc-option:hover { background: var(--s3); color: var(--t1); }
    .fc-option.sel { color: var(--cyan); }
    .fc-check { width: 14px; height: 14px; border: 1px solid var(--b2); border-radius: 3px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 9px; }
    .fc-check.on { background: var(--cyan); border-color: var(--cyan); color: var(--bg); font-weight: 700; }
    .clear-all-btn { font-size: 11px; color: var(--t3); background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; font-family: var(--ui); }
    .clear-all-btn:hover { color: var(--red); }
    /* ── Table ── */
    .table-wrap { flex: 1; overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; z-index: 5; }
    th { text-align: left; padding: 9px 14px; font-size: 11px; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: 0.07em; background: var(--s1); border-bottom: 1px solid var(--b1); user-select: none; cursor: pointer; white-space: nowrap; font-family: var(--ui); }
    th:hover { color: var(--t2); }
    th.sorted { color: var(--cyan); }
    .th-check { cursor: default; width: 40px; text-align: center; }
    td { padding: 8px 14px; font-family: var(--mono); font-size: 12px; color: var(--t2); border-bottom: 1px solid var(--b1); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; background: var(--bg); }
    tr:hover td { background: var(--s2); }
    tr.row-sel td { background: #06d6c008; }
    tr.row-sel td:first-child { box-shadow: inset 2px 0 0 var(--cyan); }
    .row-cb { accent-color: var(--cyan); cursor: pointer; width: 14px; height: 14px; }
    /* Badges */
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--ui); }
    .badge-active { background: #10b98118; color: var(--green); border: 1px solid #10b98128; }
    .badge-pending { background: #fbbf2418; color: var(--amber); border: 1px solid #fbbf2428; }
    .badge-inactive { background: #47556918; color: var(--t3); border: 1px solid #47556928; }
    .badge-enterprise { background: #a78bfa18; color: var(--purple); border: 1px solid #a78bfa28; }
    .badge-pro { background: #06d6c018; color: var(--cyan); border: 1px solid #06d6c028; }
    .badge-free { background: #47556918; color: var(--t3); border: 1px solid #47556928; }
    /* ── Empty state ── */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; color: var(--t3); }
    .empty-icon { font-size: 36px; opacity: 0.3; font-family: var(--mono); }
    .empty-h { font-size: 15px; font-weight: 600; color: var(--t2); }
    .empty-sub { font-family: var(--mono); font-size: 12px; }
    /* JSON view */
    .json-view { flex: 1; overflow: auto; padding: 16px 20px; font-family: var(--mono); font-size: 12px; line-height: 1.8; color: var(--t2); white-space: pre; }
    /* ── Action bar ── */
    .action-bar { display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--s1); border-top: 1px solid var(--cyan); flex-shrink: 0; animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sel-count { font-size: 13px; font-weight: 700; color: var(--cyan); }
    .sel-label { font-size: 12px; color: var(--t3); }
    .act-btn { padding: 6px 14px; border-radius: 6px; font-family: var(--ui); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; }
    .act-primary { background: var(--cyan); color: var(--bg); border-color: var(--cyan); }
    .act-primary:hover { background: #09f0d8; }
    .act-secondary { background: var(--s3); color: var(--t2); border-color: var(--b2); }
    .act-secondary:hover { color: var(--t1); }
    .act-ghost { background: transparent; color: var(--t3); border-color: var(--b1); }
    .act-ghost:hover { color: var(--red); border-color: #f43f5e40; }
    .ab-gap { flex: 1; }
    /* ── Action panel ── */
    .ap-backdrop { position: fixed; inset: 0; z-index: 40; }
    .action-panel { position: fixed; top: 50px; right: 0; bottom: 0; width: 380px; background: var(--s1); border-left: 1px solid var(--b2); display: flex; flex-direction: column; z-index: 50; box-shadow: -8px 0 40px rgba(0,0,0,0.5); animation: slideRight 0.2s ease; }
    @keyframes slideRight { from { transform: translateX(100%); } to { transform: none; } }
    .ap-head { padding: 18px 20px; border-bottom: 1px solid var(--b1); display: flex; align-items: flex-start; gap: 12px; }
    .ap-title { font-size: 14px; font-weight: 700; }
    .ap-sub { font-size: 12px; color: var(--t3); margin-top: 2px; }
    .ap-close { margin-left: auto; background: none; border: none; color: var(--t3); cursor: pointer; font-size: 16px; padding: 2px; line-height: 1; }
    .ap-close:hover { color: var(--t2); }
    .ap-body { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
    .ap-field { display: flex; flex-direction: column; gap: 6px; }
    .ap-label { font-size: 11px; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: 0.08em; }
    .ap-input { background: var(--bg); border: 1px solid var(--b1); border-radius: 6px; padding: 8px 12px; color: var(--t1); font-family: var(--mono); font-size: 12px; outline: none; width: 100%; }
    .ap-input:focus { border-color: var(--cyan-d); }
    .ap-select { background: var(--bg); border: 1px solid var(--b1); border-radius: 6px; padding: 8px 12px; color: var(--t2); font-family: var(--mono); font-size: 12px; outline: none; width: 100%; cursor: pointer; }
    .payload-box { flex: 1; min-height: 180px; background: var(--bg); border: 1px solid var(--b1); border-radius: 6px; padding: 12px; font-family: var(--mono); font-size: 11px; color: var(--t2); overflow: auto; white-space: pre; line-height: 1.7; }
    .ap-footer { padding: 16px 20px; border-top: 1px solid var(--b1); }
    .ap-send { width: 100%; padding: 10px; background: var(--cyan); color: var(--bg); border: none; border-radius: 8px; font-family: var(--ui); font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
    .ap-send:hover:not(:disabled) { background: #09f0d8; }
    .ap-send:disabled { opacity: 0.4; cursor: not-allowed; }
    /* ── Settings modal ── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.15s; }
    .modal { background: var(--s1); border: 1px solid var(--b2); border-radius: 12px; width: 440px; max-width: 90vw; padding: 24px; animation: scaleIn 0.15s ease; }
    @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: var(--t3); margin-bottom: 20px; }
    .modal-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .modal-label { font-size: 12px; font-weight: 600; color: var(--t2); }
    .modal-input { background: var(--bg); border: 1px solid var(--b1); border-radius: 6px; padding: 8px 12px; color: var(--t1); font-family: var(--mono); font-size: 12px; outline: none; width: 100%; }
    .modal-input:focus { border-color: var(--cyan-d); }
    .modal-hint { font-size: 11px; color: var(--t3); font-family: var(--mono); }
    .toggle-row { display: flex; align-items: center; gap: 10px; }
    .toggle { width: 36px; height: 20px; background: var(--b2); border-radius: 10px; cursor: pointer; position: relative; transition: background 0.2s; border: none; flex-shrink: 0; }
    .toggle.on { background: var(--cyan); }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: white; border-radius: 50%; transition: transform 0.2s; }
    .toggle.on::after { transform: translateX(16px); }
    .toggle-label { font-size: 13px; color: var(--t2); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .modal-btn { padding: 8px 18px; border-radius: 6px; font-family: var(--ui); font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .modal-cancel { background: var(--s3); border: 1px solid var(--b2); color: var(--t2); }
    .modal-save { background: var(--cyan); color: var(--bg); }
    /* ── Toast ── */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 200; animation: toastIn 0.25s ease; white-space: nowrap; }
    .toast-success { background: var(--green); color: white; }
    .toast-error { background: var(--red); color: white; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%); } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback, useEffect, useRef } = React;

const DEMO_RECORDS = Array.from({ length: 22 }, (_, i) => ({
  id: `USR-${String(i + 1).padStart(3, '0')}`,
  name: ['Alice van Berg','Bob Müller','Carmen López','David Chen','Eva Rossi','Frank Dubois','Grace Kim','Hans Weber','Iris Patel','Jan Novak','Karl Andersen','Lena Fischer'][i % 12],
  email: ['alice','bob','carmen','david','eva','frank','grace','hans','iris','jan','karl','lena'][i % 12] + '@example.com',
  status: ['active','pending','inactive','active','active','pending','active','inactive','active','active','pending','inactive'][i % 12],
  plan: ['pro','free','enterprise','pro','free','enterprise','pro','free','pro','enterprise','free','pro'][i % 12],
  country: ['NL','DE','ES','CN','IT','FR','KR','DE','IN','CZ','DK','DE'][i % 12],
  created_at: `2025-${String((i%12)+1).padStart(2,'0')}-${String((i*7%28)+1).padStart(2,'0')}`,
  score: [87,42,95,61,78,33,89,55,72,91,48,66][i % 12],
}));

const BADGE_COLS = ['status','plan','type','role','state','tier'];

function Badge({ col, value }) {
  if (BADGE_COLS.includes(col)) {
    return <span className={`badge badge-${String(value).toLowerCase().replace(/\s+/g,'-')}`}>{String(value ?? '')}</span>;
  }
  return <span>{String(value ?? '')}</span>;
}

async function callProxy(method, url, body, headers, proxyUrl) {
  const endpoint = proxyUrl || '/api/proxy';
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ method, url, body, headers: Object.fromEntries((headers||[]).filter(h=>h.key).map(h=>[h.key,h.value])) })
  });
  if (!res.ok) throw new Error(`Proxy error: ${res.status}`);
  return res.json();
}

async function mockCall(method, url, body) {
  await new Promise(r => setTimeout(r, 400 + Math.random() * 700));
  const t = Math.floor(400 + Math.random() * 700);
  if (method === 'GET') return { ok: true, status: 200, statusText: 'OK', time: t, data: DEMO_RECORDS };
  let parsed = {};
  try { parsed = body ? JSON.parse(body) : {}; } catch {}
  return { ok: true, status: 201, statusText: 'Created', time: t, data: { created: true, id: `ID-${Math.floor(Math.random()*9000+1000)}`, ...parsed } };
}

function App() {
  const [getUrl, setGetUrl] = useState('https://api.example.com/users?status=active');
  const [getHeaders, setGetHeaders] = useState([{ key: '', value: '' }]);
  const [getHeadersOpen, setGetHeadersOpen] = useState(false);
  const [getResult, setGetResult] = useState(null);
  const [postUrl, setPostUrl] = useState('https://api.example.com/users');
  const [postBody, setPostBody] = useState('{\n  "name": "New User",\n  "plan": "pro",\n  "country": "NL"\n}');
  const [postHeaders, setPostHeaders] = useState([{ key: '', value: '' }]);
  const [postHeadersOpen, setPostHeadersOpen] = useState(false);
  const [postResult, setPostResult] = useState(null);
  const [loading, setLoading] = useState(null);
  const [activeTab, setActiveTab] = useState('get');
  const [viewMode, setViewMode] = useState('table');
  const [filters, setFilters] = useState({});
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState({ col: null, dir: 'asc' });
  const [selected, setSelected] = useState(new Set());
  const [openFilterCol, setOpenFilterCol] = useState(null);
  const [actionUrl, setActionUrl] = useState('https://api.example.com/bulk');
  const [actionMethod, setActionMethod] = useState('POST');
  const [actionPanelOpen, setActionPanelOpen] = useState(false);
  const [actionLoading, setActionLoading] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [proxyUrl, setProxyUrl] = useState('');
  const [demoMode, setDemoMode] = useState(true);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const showToast = (msg, type = 'success') => {
    clearTimeout(toastTimer.current);
    setToast({ msg, type });
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  };

  const currentResult = activeTab === 'get' ? getResult : postResult;
  const rawData = useMemo(() => {
    if (!currentResult?.data) return [];
    if (Array.isArray(currentResult.data)) return currentResult.data;
    if (typeof currentResult.data === 'object') return [currentResult.data];
    return [];
  }, [currentResult]);

  const columns = useMemo(() => rawData.length ? Object.keys(rawData[0]) : [], [rawData]);

  const filteredData = useMemo(() => {
    let d = rawData;
    Object.entries(filters).forEach(([col, vals]) => {
      if (vals?.length) d = d.filter(r => vals.includes(String(r[col] ?? '')));
    });
    if (search.trim()) {
      const s = search.toLowerCase();
      d = d.filter(r => Object.values(r).some(v => String(v ?? '').toLowerCase().includes(s)));
    }
    if (sort.col) {
      d = [...d].sort((a, b) => {
        const cmp = String(a[sort.col]??'').localeCompare(String(b[sort.col]??''), undefined, { numeric: true });
        return sort.dir === 'asc' ? cmp : -cmp;
      });
    }
    return d;
  }, [rawData, filters, search, sort]);

  const uniqueVals = useCallback(col => [...new Set(rawData.map(r => String(r[col]??'')))].sort(), [rawData]);
  const filterableCols = columns.filter(col => { const u = uniqueVals(col); return u.length >= 2 && u.length <= 12; });
  const activeFilterCount = Object.values(filters).reduce((a, v) => a + (v?.length||0), 0);

  const doCall = async (method, url, body, headers) => {
    if (demoMode) return mockCall(method, url, body);
    const t0 = Date.now();
    const res = await callProxy(method, url, body, headers, proxyUrl);
    return { ...res, time: Date.now() - t0 };
  };

  const handleGet = async () => {
    setLoading('get'); setSelected(new Set()); setFilters({}); setSearch(''); setSort({ col: null, dir: 'asc' });
    try {
      const res = await doCall('GET', getUrl, null, getHeaders);
      setGetResult(res); setActiveTab('get');
    } catch (e) {
      setGetResult({ ok: false, status: 0, statusText: 'Error', time: 0, data: [], error: e.message });
      showToast('Request failed: ' + e.message, 'error');
    } finally { setLoading(null); }
  };

  const handlePost = async () => {
    setLoading('post');
    try {
      const res = await doCall('POST', postUrl, postBody, postHeaders);
      setPostResult(res); setActiveTab('post');
    } catch (e) {
      setPostResult({ ok: false, status: 0, statusText: 'Error', time: 0, data: [], error: e.message });
      showToast('Request failed: ' + e.message, 'error');
    } finally { setLoading(null); }
  };

  const handleGroupAction = async () => {
    setActionLoading(true);
    try {
      const rows = [...selected].map(i => filteredData[i]);
      await doCall(actionMethod, actionUrl, JSON.stringify(rows), []);
      showToast(`${actionMethod} sent for ${rows.length} row${rows.length > 1 ? 's' : ''}`);
      setSelected(new Set()); setActionPanelOpen(false);
    } catch (e) { showToast('Action failed: ' + e.message, 'error'); }
    finally { setActionLoading(false); }
  };

  const toggleRow = i => setSelected(p => { const n = new Set(p); n.has(i) ? n.delete(i) : n.add(i); return n; });
  const toggleAll = () => setSelected(selected.size === filteredData.length && filteredData.length > 0 ? new Set() : new Set(filteredData.map((_,i) => i)));
  const toggleFilter = (col, val) => setFilters(p => ({ ...p, [col]: (p[col]||[]).includes(val) ? (p[col]||[]).filter(v=>v!==val) : [...(p[col]||[]),val] }));
  const clearFilter = col => setFilters(p => { const n={...p}; delete n[col]; return n; });
  const handleSort = col => setSort(p => p.col === col ? { col, dir: p.dir==='asc'?'desc':'asc' } : { col, dir: 'asc' });

  const updateHeader = (arr, setArr, i, field, val) => setArr(arr.map((h,j) => j===i ? {...h,[field]:val} : h));
  const addHeader = (arr, setArr) => setArr([...arr, { key: '', value: '' }]);
  const rmHeader = (arr, setArr, i) => setArr(arr.filter((_,j) => j!==i));

  const copyData = fmt => {
    const rows = selected.size > 0 ? [...selected].map(i => filteredData[i]) : filteredData;
    if (!rows.length) return;
    const text = fmt === 'json'
      ? JSON.stringify(rows, null, 2)
      : [Object.keys(rows[0]).join(','), ...rows.map(r => Object.keys(rows[0]).map(c => `"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n');
    navigator.clipboard.writeText(text).then(() => showToast(`Copied ${rows.length} rows as ${fmt.toUpperCase()}`));
  };

  useEffect(() => {
    const h = () => setOpenFilterCol(null);
    document.addEventListener('click', h);
    return () => document.removeEventListener('click', h);
  }, []);

  const statusClass = s => { const n = Number(s); return n >= 200 && n < 300 ? 's-2xx' : 's-err'; };

  const payloadPreview = useMemo(() => {
    const rows = [...selected].slice(0, 3).map(i => filteredData[i]);
    const preview = JSON.stringify(rows, null, 2);
    return selected.size > 3 ? preview + `\n// ... and ${selected.size - 3} more rows` : preview;
  }, [selected, filteredData]);

  return (
    <div id="app">
      <header className="header">
        <div className="logo-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" fill="#06d6c018" stroke="#06d6c0" strokeWidth="1.5"/>
            <circle cx="12" cy="12" r="3" fill="#06d6c0"/>
          </svg>
          <span className="logo-name">example.app</span>
        </div>
        <div className="header-sep"/>
        <span className="header-subtitle">API Explorer</span>
        <div className="header-gap"/>
        <div className="header-badge" onClick={() => setSettingsOpen(true)}>
          <div className={`live-dot ${demoMode ? 'demo-dot' : ''}`}/>
          {demoMode ? 'Demo mode' : 'Live'}
        </div>
        <button className="icon-btn" title="Settings" onClick={() => setSettingsOpen(true)}>⚙</button>
      </header>

      {loading && <div className="loading-bar"/>}

      <div className="request-row">
        {/* GET Panel */}
        <div className="req-panel">
          <div className="req-header">
            <span className="method-tag tag-get">GET</span>
            <span className="req-title">Fetch Records</span>
            <div className="req-actions">
              <button className="ghost-btn" onClick={() => { setGetResult(null); setSelected(new Set()); }}>Clear</button>
            </div>
          </div>
          <div className="url-row">
            <input className="url-input" value={getUrl} onChange={e => setGetUrl(e.target.value)}
              placeholder="https://api.example.com/endpoint"
              onKeyDown={e => e.key === 'Enter' && !loading && handleGet()}/>
            <button className="send-btn btn-get" onClick={handleGet} disabled={!!loading}>
              {loading === 'get' ? '···' : 'Send →'}
            </button>
          </div>
          <div>
            <div className="headers-toggle" onClick={() => setGetHeadersOpen(!getHeadersOpen)}>
              <i className={`h-arrow ${getHeadersOpen ? 'open' : ''}`}>▶</i>
              Headers {getHeaders.filter(h=>h.key).length > 0 && `(${getHeaders.filter(h=>h.key).length})`}
            </div>
            {getHeadersOpen && (
              <div className="headers-grid">
                {getHeaders.map((h, i) => (
                  <div className="header-row" key={i}>
                    <input className="header-input" placeholder="Key" value={h.key} onChange={e => updateHeader(getHeaders, setGetHeaders, i, 'key', e.target.value)}/>
                    <input className="header-input" placeholder="Value" value={h.value} onChange={e => updateHeader(getHeaders, setGetHeaders, i, 'value', e.target.value)}/>
                    <button className="rm-btn" onClick={() => rmHeader(getHeaders, setGetHeaders, i)}>×</button>
                  </div>
                ))}
                <button className="add-header-btn" onClick={() => addHeader(getHeaders, setGetHeaders)}>+ Add header</button>
              </div>
            )}
          </div>
        </div>

        {/* POST Panel */}
        <div className="req-panel">
          <div className="req-header">
            <span className="method-tag tag-post">POST</span>
            <span className="req-title">Create / Update</span>
            <div className="req-actions">
              <button className="ghost-btn" onClick={() => setPostResult(null)}>Clear</button>
            </div>
          </div>
          <div className="url-row">
            <input className="url-input post-focus" value={postUrl} onChange={e => setPostUrl(e.target.value)}
              placeholder="https://api.example.com/endpoint"/>
            <button className="send-btn btn-post" onClick={handlePost} disabled={!!loading}>
              {loading === 'post' ? '···' : 'Post →'}
            </button>
          </div>
          <textarea className="body-area" value={postBody} onChange={e => setPostBody(e.target.value)} placeholder={'{\n  "key": "value"\n}'}/>
          <div>
            <div className="headers-toggle" onClick={() => setPostHeadersOpen(!postHeadersOpen)}>
              <i className={`h-arrow ${postHeadersOpen ? 'open' : ''}`}>▶</i>
              Headers {postHeaders.filter(h=>h.key).length > 0 && `(${postHeaders.filter(h=>h.key).length})`}
            </div>
            {postHeadersOpen && (
              <div className="headers-grid">
                {postHeaders.map((h, i) => (
                  <div className="header-row" key={i}>
                    <input className="header-input" placeholder="Key" value={h.key} onChange={e => updateHeader(postHeaders, setPostHeaders, i, 'key', e.target.value)}/>
                    <input className="header-input" placeholder="Value" value={h.value} onChange={e => updateHeader(postHeaders, setPostHeaders, i, 'value', e.target.value)}/>
                    <button className="rm-btn" onClick={() => rmHeader(postHeaders, setPostHeaders, i)}>×</button>
                  </div>
                ))}
                <button className="add-header-btn" onClick={() => addHeader(postHeaders, setPostHeaders)}>+ Add header</button>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Results Area */}
      <div className="results-area">
        <div className="results-toolbar">
          <div className="tab-group">
            <button className={`tab ${activeTab==='get' ? 'active-get' : ''}`} onClick={() => setActiveTab('get')}>
              GET {getResult && `· ${Array.isArray(getResult.data) ? getResult.data.length : 1}`}
            </button>
            <button className={`tab ${activeTab==='post' ? 'active-post' : ''}`} onClick={() => setActiveTab('post')}>
              POST {postResult ? '· ✓' : ''}
            </button>
          </div>

          {currentResult && (
            <div className="resp-meta">
              <span className={`status-chip ${statusClass(currentResult.status)}`}>{currentResult.status} {currentResult.statusText}</span>
              <span className="meta-chip">{currentResult.time}ms</span>
              {rawData.length > 0 && <span className="meta-chip">· {filteredData.length}/{rawData.length} rows</span>}
            </div>
          )}

          <div className="tb-spacer"/>

          {rawData.length > 0 && (
            <>
              <div className="view-toggle">
                <button className={`vt-btn ${viewMode==='table'?'active':''}`} onClick={() => setViewMode('table')}>Table</button>
                <button className={`vt-btn ${viewMode==='json'?'active':''}`} onClick={() => setViewMode('json')}>JSON</button>
              </div>
              <div className="search-wrap">
                <span className="search-icon">⌕</span>
                <input className="search-box" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search all fields..."/>
              </div>
              <button className="copy-btn" onClick={() => copyData('csv')}>CSV</button>
              <button className="copy-btn" onClick={() => copyData('json')}>JSON</button>
            </>
          )}
        </div>

        {filterableCols.length > 0 && viewMode === 'table' && (
          <div className="filter-bar" onClick={e => e.stopPropagation()}>
            <span className="filter-label">Filter by</span>
            {filterableCols.map(col => {
              const active = filters[col] || [];
              return (
                <div className="fc-wrap" key={col}>
                  <div className={`filter-chip ${active.length ? 'active' : ''}`}
                    onClick={e => { e.stopPropagation(); setOpenFilterCol(openFilterCol===col ? null : col); }}>
                    {col.replace(/_/g,' ')}
                    {active.length > 0 && <span className="fc-count">{active.length}</span>}
                    <span className="fc-arrow">{openFilterCol===col ? '▲' : '▼'}</span>
                  </div>
                  {openFilterCol === col && (
                    <div className="fc-dropdown" onClick={e => e.stopPropagation()}>
                      {uniqueVals(col).map(v => (
                        <div key={v} className={`fc-option ${active.includes(v)?'sel':''}`} onClick={() => toggleFilter(col, v)}>
                          <div className={`fc-check ${active.includes(v)?'on':''}`}>{active.includes(v)?'✓':''}</div>
                          <Badge col={col} value={v}/>
                        </div>
                      ))}
                      {active.length > 0 && (
                        <div style={{padding:'6px 12px', borderTop:'1px solid var(--b1)'}}>
                          <button className="clear-all-btn" onClick={() => clearFilter(col)}>Clear filter</button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
            {activeFilterCount > 0 && (
              <button className="clear-all-btn" onClick={() => setFilters({})}>✕ Clear all ({activeFilterCount})</button>
            )}
          </div>
        )}

        {rawData.length === 0 ? (
          <div className="empty-state">
            <div className="empty-icon">◈</div>
            <div className="empty-h">No results yet</div>
            <div className="empty-sub">Send a GET or POST request above to see data here</div>
          </div>
        ) : viewMode === 'json' ? (
          <div className="json-view">{JSON.stringify(filteredData.length < rawData.length ? filteredData : currentResult.data, null, 2)}</div>
        ) : (
          <div className="table-wrap">
            {filteredData.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">◎</div>
                <div className="empty-h">No matches</div>
                <div className="empty-sub">Try adjusting your filters or search query</div>
              </div>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th className="th-check">
                      <input type="checkbox" className="row-cb"
                        checked={filteredData.length > 0 && selected.size === filteredData.length}
                        onChange={toggleAll}/>
                    </th>
                    {columns.map(col => (
                      <th key={col} className={sort.col===col?'sorted':''} onClick={() => handleSort(col)}>
                        {col.replace(/_/g,' ')}
                        <span style={{marginLeft:4, fontSize:9, opacity: sort.col===col?1:0.3, color: sort.col===col?'var(--cyan)':'inherit'}}>
                          {sort.col===col ? (sort.dir==='asc'?'↑':'↓') : '↕'}
                        </span>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filteredData.map((row, i) => (
                    <tr key={i} className={selected.has(i) ? 'row-sel' : ''}>
                      <td style={{textAlign:'center'}}>
                        <input type="checkbox" className="row-cb" checked={selected.has(i)} onChange={() => toggleRow(i)}/>
                      </td>
                      {columns.map(col => (
                        <td key={col} title={String(row[col]??'')}>
                          <Badge col={col} value={row[col]}/>
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        )}

        {selected.size > 0 && (
          <div className="action-bar">
            <span className="sel-count">{selected.size}</span>
            <span className="sel-label">row{selected.size>1?'s':''} selected</span>
            <button className="act-btn act-primary" onClick={() => setActionPanelOpen(true)}>⚡ Send POST/PATCH</button>
            <button className="act-btn act-secondary" onClick={() => copyData('csv')}>Copy CSV</button>
            <button className="act-btn act-secondary" onClick={() => copyData('json')}>Copy JSON</button>
            <div className="ab-gap"/>
            <button className="act-btn act-ghost" onClick={() => setSelected(new Set())}>Deselect all</button>
          </div>
        )}
      </div>

      {/* Group Action Panel */}
      {actionPanelOpen && (
        <>
          <div className="ap-backdrop" onClick={() => setActionPanelOpen(false)}/>
          <div className="action-panel">
            <div className="ap-head">
              <div>
                <div className="ap-title">Group Action</div>
                <div className="ap-sub">{selected.size} row{selected.size>1?'s':''} will be sent as payload</div>
              </div>
              <button className="ap-close" onClick={() => setActionPanelOpen(false)}>✕</button>
            </div>
            <div className="ap-body">
              <div className="ap-field">
                <div className="ap-label">Method</div>
                <select className="ap-select" value={actionMethod} onChange={e => setActionMethod(e.target.value)}>
                  <option>POST</option><option>PATCH</option><option>PUT</option><option>DELETE</option>
                </select>
              </div>
              <div className="ap-field">
                <div className="ap-label">Endpoint URL</div>
                <input className="ap-input" value={actionUrl} onChange={e => setActionUrl(e.target.value)} placeholder="https://api.example.com/..."/>
              </div>
              <div className="ap-field" style={{flex:1}}>
                <div className="ap-label">Payload Preview</div>
                <div className="payload-box">{payloadPreview}</div>
              </div>
            </div>
            <div className="ap-footer">
              <button className="ap-send" onClick={handleGroupAction} disabled={actionLoading || !actionUrl}>
                {actionLoading ? 'Sending···' : `⚡ Send ${actionMethod} · ${selected.size} rows`}
              </button>
            </div>
          </div>
        </>
      )}

      {/* Settings */}
      {settingsOpen && (
        <div className="modal-bg" onClick={() => setSettingsOpen(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-title">Settings</div>
            <div className="modal-sub">Configure your API proxy and connection mode</div>
            <div className="modal-field">
              <div className="toggle-row">
                <button className={`toggle ${demoMode?'on':''}`} onClick={() => setDemoMode(!demoMode)}/>
                <span className="toggle-label">Demo mode — uses mock data, no real requests sent</span>
              </div>
            </div>
            <div className="modal-field">
              <div className="modal-label">Proxy URL</div>
              <input className="modal-input" value={proxyUrl} onChange={e => setProxyUrl(e.target.value)} placeholder="https://your-proxy.run.app"/>
              <div className="modal-hint">Your Cloud Run backend URL. Leave blank to use /api/proxy (same origin).</div>
            </div>
            <div className="modal-footer">
              <button className="modal-btn modal-cancel" onClick={() => setSettingsOpen(false)}>Cancel</button>
              <button className="modal-btn modal-save" onClick={() => { setSettingsOpen(false); showToast('Settings saved'); }}>Save</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className={`toast toast-${toast.type}`}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
